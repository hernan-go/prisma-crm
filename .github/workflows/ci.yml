name: Validate PRISMA CRM
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
  integrations:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - tests/integration.test.ts
          - tests/identity-db.test.ts
          - tests/statistics-annual-db.test.ts
          - tests/identity-bindings-db.test.ts
          - tests/oidc-db.test.ts
          - tests/binding-b2-db.test.ts
    # Each matrix job gets a NEW service, schema, user, UUID and marker.
    # Matrix scheduling order is irrelevant: no suite consumes another's state.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: prisma_disposable_ci
          MYSQL_USER: prisma_ci
          MYSQL_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -plocal-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: prisma_disposable_ci
      DB_USER: prisma_ci
      DB_PASSWORD: disposable-ci-only
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Accredit this runner's disposable MySQL service
        shell: bash
        run: |
          set -euo pipefail
          service_id='${{ job.services.mysql.id }}'
          server_uuid=$(docker exec "$service_id" mysql -uroot -plocal-ci-only -Nse 'SELECT @@server_uuid')
          token=$(openssl rand -hex 32)
          docker exec "$service_id" mysql -uroot -plocal-ci-only prisma_disposable_ci -e "CREATE TABLE prisma_test_disposable_marker (token CHAR(64) NOT NULL, server_uuid CHAR(36) NOT NULL); INSERT INTO prisma_test_disposable_marker VALUES ('$token', '$server_uuid');"
          echo "TEST_DB_SERVER_UUID=$server_uuid" >> "$GITHUB_ENV"
          echo "TEST_DB_DISPOSABLE_TOKEN=$token" >> "$GITHUB_ENV"
          echo 'ALLOW_DESTRUCTIVE_DB_TESTS=destroy-disposable-only' >> "$GITHUB_ENV"
      - name: Single integration suite on its own accredited service
        run: npx vitest run --no-file-parallelism --hookTimeout=30000 "${{ matrix.suite }}"
